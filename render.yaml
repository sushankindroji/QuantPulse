services:
  - type: web
    name: quantpulse-backend
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: QP_DATA_MODE
        value: demo
      - key: QP_STORAGE_BACKEND
        value: local

  - type: pserv
    name: quantpulse-postgres
    runtime: postgres
    plan: standard
    region: oregon
    postgres:
      version: 16
      database: quantpulse
      user: quantpulse
