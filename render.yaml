services:
  - type: web
    name: quantpulse-backend
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: QP_DATA_MODE
        value: demo
      - key: QP_STORAGE_BACKEND
        value: local
    healthCheckPath: /health
    healthCheckInterval: 300
    healthCheckTimeout: 30

  - type: pserv
    name: quantpulse-postgres
    runtime: postgres
    plan: standard
    region: oregon
    ipAllowList: []
    postgres:
      version: 16
      database: quantpulse
      user: quantpulse
      initialSqlPath: ./db/schema.sql
